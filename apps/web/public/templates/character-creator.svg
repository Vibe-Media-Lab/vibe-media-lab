<svg width="720" height="1280" viewBox="0 0 720 1280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f23"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f4258c"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
  </defs>
  <rect width="720" height="1280" fill="url(#bg)"/>
  <!-- Center icon -->
  <circle cx="360" cy="500" r="120" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.6"/>
  <circle cx="360" cy="500" r="80" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.3"/>
  <text x="360" y="510" text-anchor="middle" font-family="system-ui" font-size="80" fill="#00e5ff" opacity="0.8">🎭</text>
  <!-- Title -->
  <text x="360" y="720" text-anchor="middle" font-family="system-ui" font-weight="bold" font-size="42" fill="white">Character Creator</text>
  <text x="360" y="770" text-anchor="middle" font-family="system-ui" font-size="24" fill="white" opacity="0.6">AI로 나만의 캐릭터를 디자인하세요</text>
  <!-- Badge -->
  <rect x="310" y="810" width="100" height="36" rx="18" fill="#00e5ff"/>
  <text x="360" y="834" text-anchor="middle" font-family="system-ui" font-weight="bold" font-size="14" fill="#0a0a0a">NEW</text>
</svg>
